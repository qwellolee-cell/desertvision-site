<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desert Vision — Coming Soon</title>
<meta name="description" content="Desert Vision is an independent electronic music label based in Ancona, Italy.">
<meta property="og:title" content="Desert Vision — Independent Label">
<meta property="og:description" content="Deep, emotional, boundary-pushing sounds. Ancona, Italy. Worldwide.">
<meta property="og:url" content="https://desertvision.it">
<meta property="og:type" content="website">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;}
body{
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
  background:#f0ebe0;
  color:#1c1c1a;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  position:relative;
}

/* SVG BACKGROUND */
#bg-svg{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none;
}

/* CONTENT */
.content{
  position:relative;
  z-index:10;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  padding:32px;
  max-width:640px;
  width:100%;
}

/* BLACK TITLE BLOCK */
.title-block{
  background:#1c1c1a;
  padding:20px 28px 22px;
  margin-bottom:28px;
  display:inline-block;
}
.title-block h1{
  font-size:clamp(36px,8vw,72px);
  font-weight:800;
  letter-spacing:-1px;
  line-height:1;
  color:#f0ebe0;
}
.title-block .sub{
  font-size:clamp(20px,4vw,36px);
  font-weight:400;
  color:#f0ebe0;
  line-height:1.1;
  margin-top:4px;
}

/* UNDER CONSTRUCTION */
.status{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:24px;
}
.status-dot{
  width:8px;height:8px;border-radius:50%;
  background:#d4462a;
  animation:blink 1.4s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.2;}}
.status-text{
  font-size:11px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:#3a3832;
}

/* TAGLINE */
.tagline{
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#3a3832;
  line-height:2;
  margin-bottom:32px;
  border-left:3px solid #d4462a;
  padding-left:14px;
}

/* LINKS */
.links{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  margin-bottom:32px;
}
.links a{
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#1c1c1a;
  text-decoration:none;
  border-bottom:2px solid #1c1c1a;
  padding-bottom:2px;
  transition:color 0.15s,border-color 0.15s;
}
.links a:hover{color:#d4462a;border-color:#d4462a;}

/* GAME LINK */
.game-link{
  display:inline-flex;
  align-items:center;
  gap:12px;
  background:#d4462a;
  color:#f0ebe0;
  text-decoration:none;
  padding:12px 24px;
  font-size:11px;
  letter-spacing:3px;
  text-transform:uppercase;
  font-weight:700;
  transition:background 0.15s;
}
.game-link:hover{background:#bf3d24;}
.game-link .arrow{font-size:18px;}

/* LOCATION */
.location{
  position:fixed;
  bottom:24px;
  right:24px;
  font-size:9px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#3a3832;
  opacity:0.5;
  z-index:10;
}
</style>
</head>
<body>

<svg id="bg-svg" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <!-- horizontal lines -->
  <line x1="0" y1="22" x2="100" y2="22" stroke="#EE352E" stroke-width="2.5" opacity="0.18"/>
  <line x1="0" y1="38" x2="100" y2="38" stroke="#0039A6" stroke-width="2" opacity="0.15"/>
  <line x1="0" y1="58" x2="65" y2="58" stroke="#FF6319" stroke-width="2" opacity="0.15"/>
  <line x1="0" y1="72" x2="100" y2="72" stroke="#FCCC0A" stroke-width="1.8" opacity="0.2"/>
  <line x1="0" y1="85" x2="40" y2="85" stroke="#996633" stroke-width="1.5" opacity="0.15"/>
  <!-- vertical lines -->
  <line x1="15" y1="0" x2="15" y2="100" stroke="#00933C" stroke-width="2" opacity="0.15"/>
  <line x1="42" y1="0" x2="42" y2="58" stroke="#6D2F8E" stroke-width="2" opacity="0.15"/>
  <line x1="65" y1="58" x2="65" y2="100" stroke="#FF6319" stroke-width="2" opacity="0.15"/>
  <line x1="72" y1="0" x2="72" y2="100" stroke="#6CBE45" stroke-width="1.5" opacity="0.12"/>
  <line x1="88" y1="0" x2="88" y2="38" stroke="#A7A9AC" stroke-width="1.5" opacity="0.15"/>
  <line x1="88" y1="38" x2="100" y2="38" stroke="#A7A9AC" stroke-width="1.5" opacity="0.15"/>
  <line x1="40" y1="85" x2="40" y2="100" stroke="#996633" stroke-width="1.5" opacity="0.15"/>
  <line x1="42" y1="58" x2="100" y2="58" stroke="#6D2F8E" stroke-width="2" opacity="0.15"/>
</svg>

<div class="content">
  <div class="status">
    <div class="status-dot"></div>
    <span class="status-text">New site coming soon</span>
  </div>

  <div class="title-block">
    <h1>Desert<br>Vision</h1>
  </div>

  <div class="tagline">
    Ancona, Italy · Worldwide
  </div>

  <a class="game-link" href="https://stroopwafel.desertvision.it" target="_blank">
    <span>Play Stroopwafel — KITA Remix</span>
    <span class="arrow">→</span>
  </a>

  <div style="height:24px;"></div>

  <div class="links">
    <a href="https://www.beatport.com/it/label/desert-vision/112355" target="_blank">Beatport</a>
    <a href="https://soundcloud.com/desert-vision" target="_blank">Soundcloud</a>
    <a href="https://www.instagram.com/desertvision_music/" target="_blank">Instagram</a>
  </div>
</div>

<div class="location">Ancona · Italy · Est. 2023</div>

</body>
</html>
