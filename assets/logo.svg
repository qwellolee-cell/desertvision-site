<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono&amp;display=swap');
      .wm{font-family:'Space Mono',monospace;font-size:26px;letter-spacing:6px;fill:#EFEAE0;}
    </style>
  </defs>

  <circle cx="200" cy="200" r="200" fill="#161512"/>

  <g stroke="#EFEAE0" stroke-width="9" stroke-linecap="round" fill="none">
    <!-- upper lid -->
    <path d="M 78,163 C 120,105 280,105 322,163"/>
    <!-- lower lid -->
    <path d="M 78,177 C 120,235 280,235 322,177"/>
    <!-- corner ticks -->
    <path d="M 78,163 L 64,155"/>
    <path d="M 78,177 L 64,185"/>
    <path d="M 322,163 L 336,155"/>
    <path d="M 322,177 L 336,185"/>
    <!-- iris -->
    <circle cx="200" cy="170" r="46"/>
  </g>

  <!-- four-point star, warm copper -->
  <path d="M200,126 C205,156 212,163 240,170 C212,177 205,184 200,214 C195,184 188,177 160,170 C188,163 195,156 200,126 Z" fill="#C17F4A"/>

  <!-- single violet paint drip from the lower lid -->
  <g fill="#7B5EA7">
    <path d="M252,214 L259,214 L258,262 C258,266 254,266 253,262 Z"/>
    <circle cx="255.5" cy="265" r="6.5"/>
  </g>

  <text class="wm" x="200" y="326" text-anchor="middle">desert vision</text>
</svg>
